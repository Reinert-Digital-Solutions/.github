name: Fehler melden
description: Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: beschreibung
    attributes:
      label: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was wurde erwartet?
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zur Reproduktion
      placeholder: "1. ...\n2. ..."
  - type: input
    id: umgebung
    attributes:
      label: Umgebung (Version, Browser, Server)
